name: Kirim Update (OTA)

# Mengirim perubahan JavaScript dan aset ke aplikasi yang sudah terpasang,
# tanpa build ulang. Perubahan native (menambah library native, mengubah
# izin atau konfigurasi app.json) tidak bisa lewat sini dan tetap butuh
# build baru; kebijakan runtimeVersion "fingerprint" yang menjaganya, jadi
# update hanya turun ke build yang kode native-nya cocok.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel tujuan"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
      message:
        description: "Catatan perubahan"
        required: true
        default: "Pembaruan UI"
        type: string

jobs:
  update:
    name: EAS Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src --max-warnings=0

      - name: Kirim update
        run: eas update --channel ${{ inputs.channel }} --message "${{ inputs.message }}" --non-interactive
